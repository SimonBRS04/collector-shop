# Tableau de bord Grafana chargé automatiquement (label grafana_dashboard) dans le namespace monitoring.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-sandbox-load
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  collector-sandbox-load.json: |
    {
      "uid": "collector-sandbox-load",
      "title": "Collector — Expérience 4 : montée en charge",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Débit (requêtes / s)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(http_request_duration_seconds_count{namespace=\"sandbox-obs\",route=\"/work\"}[1m]))",
              "legendFormat": "req/s"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Temps de réponse p95 (seuil 500 ms)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ms"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"sandbox-obs\",route=\"/work\"}[1m])) by (le)) * 1000",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Pods : disponibles / souhaités par le HPA",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"sandbox-obs\",deployment=\"load-api\"}",
              "legendFormat": "disponibles"
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"sandbox-obs\",horizontalpodautoscaler=\"load-api\"}",
              "legendFormat": "souhaités (HPA)"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "CPU par pod (millicores, request = 100m)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"sandbox-obs\",container=\"api\"}[1m])) by (pod) * 1000",
              "legendFormat": "{{pod}}"
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Taux d'erreur (%) (seuil 1 %)",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 24,
            "h": 6
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * sum(rate(http_request_duration_seconds_count{namespace=\"sandbox-obs\",route=\"/work\",status_code!=\"200\"}[1m])) / clamp_min(sum(rate(http_request_duration_seconds_count{namespace=\"sandbox-obs\",route=\"/work\"}[1m])), 1e-9)",
              "legendFormat": "erreurs"
            }
          ]
        }
      ],
      "tags": [
        "collector",
        "sandbox"
      ]
    }
